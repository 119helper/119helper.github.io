name: 🔄 소방용수시설 데이터 업데이트

# 분기별 자동 실행 (1,4,7,10월 1일) + 수동 실행
on:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      source_date:
        description: '원본 데이터 기준일(선택, 예: 2026-07-01)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-firewater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate API secret
        run: test -n "$FIRE_WATER_API_KEY" || { echo "FIRE_WATER_API_KEY secret is required"; exit 1; }
        env:
          FIRE_WATER_API_KEY: ${{ secrets.FIRE_WATER_API_KEY }}

      - name: 공공데이터 API → JSON 동기화
        run: node scripts/sync-firewater.js
        env:
          FIRE_WATER_API_KEY: ${{ secrets.FIRE_WATER_API_KEY }}
          FIREWATER_SOURCE_DATE: ${{ inputs.source_date }}

      - name: 변경 사항 확인
        id: check
        run: |
          git diff --name-only public/firewater/ | head -20
          echo "changed=$(git diff --quiet public/firewater/ && echo 'false' || echo 'true')" >> "$GITHUB_OUTPUT"

      - name: 커밋 & 푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/firewater/
          git commit -m "chore: 소방용수시설 데이터 업데이트 ($(date +%Y-%m-%d))"
          git push
