name: 🚒 119 Helper CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: 🔨 Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Worker type check
        working-directory: worker
        run: npm exec -- tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Worker tests
        run: npm run test:worker

      - name: Validate production frontend secrets
        if: github.event_name != 'pull_request'
        run: |
          test -n "$VITE_APP_TOKEN" || { echo "VITE_APP_TOKEN secret is required for production builds"; exit 1; }
          test -n "$VITE_KAKAO_MAP_KEY" || { echo "VITE_KAKAO_MAP_KEY secret is required for production builds"; exit 1; }
        env:
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}

      - name: Build
        run: npm run build
        env:
          # API 키는 Worker 서버에만 존재. 프론트엔드에는 Worker URL만 필요.
          VITE_API_BASE: https://119-helper-api.teemozipsa.workers.dev
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          # Worker의 APP_ACCESS_TOKEN과 동일해야 함
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      # 오프라인 동작 보증: 이 테스트가 깨지면 현장에서 신호 끊겼을 때 앱이 안 뜬다
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Offline E2E tests
        run: npx playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Validate production frontend secrets
        run: |
          test -n "$VITE_APP_TOKEN" || { echo "VITE_APP_TOKEN secret is required for production deploys"; exit 1; }
          test -n "$VITE_KAKAO_MAP_KEY" || { echo "VITE_KAKAO_MAP_KEY secret is required for production deploys"; exit 1; }
        env:
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://119-helper-api.teemozipsa.workers.dev
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}
          # Worker의 APP_ACCESS_TOKEN과 동일해야 함
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      - name: Validate Worker deploy secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is required"; exit 1; }
          test -n "$NEWS_CACHE_KV_ID" || { echo "NEWS_CACHE_KV_ID secret is required"; exit 1; }
          test -n "$NEWS_CACHE_KV_PREVIEW_ID" || { echo "NEWS_CACHE_KV_PREVIEW_ID secret is required"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEWS_CACHE_KV_ID: ${{ secrets.NEWS_CACHE_KV_ID }}
          NEWS_CACHE_KV_PREVIEW_ID: ${{ secrets.NEWS_CACHE_KV_PREVIEW_ID }}

      - name: Generate Worker CI config
        working-directory: worker
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const required = ['NEWS_CACHE_KV_ID', 'NEWS_CACHE_KV_PREVIEW_ID'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required`);
          }
          const config = [
            'name = "119-helper-api"',
            'main = "src/index.ts"',
            'compatibility_date = "2026-07-07"',
            'compatibility_flags = ["nodejs_compat"]',
            '',
            '[vars]',
            'ENVIRONMENT = "production"',
            '',
            '[observability]',
            'enabled = true',
            '',
            '[observability.logs]',
            'head_sampling_rate = 1',
            '',
            '[[unsafe.bindings]]',
            'name = "RATE_LIMITER"',
            'type = "ratelimit"',
            'namespace_id = "1001"',
            'simple = { limit = 60, period = 60 }',
            '',
            '[[kv_namespaces]]',
            'binding = "NEWS_CACHE"',
            `id = "${process.env.NEWS_CACHE_KV_ID}"`,
            `preview_id = "${process.env.NEWS_CACHE_KV_PREVIEW_ID}"`,
            '',
            '[triggers]',
            'crons = ["*/30 * * * *"]',
            '',
          ].join('\n');
          fs.writeFileSync('wrangler.ci.toml', config);
          NODE
        env:
          NEWS_CACHE_KV_ID: ${{ secrets.NEWS_CACHE_KV_ID }}
          NEWS_CACHE_KV_PREVIEW_ID: ${{ secrets.NEWS_CACHE_KV_PREVIEW_ID }}

      - name: Deploy Worker
        working-directory: worker
        run: npm exec -- wrangler deploy --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production Worker smoke test
        run: node scripts/smoke-production-api.mjs
        env:
          VITE_API_BASE: https://119-helper-api.teemozipsa.workers.dev
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
