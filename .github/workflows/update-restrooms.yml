name: Update Restroom Data

on:
  schedule:
    - cron: '23 0 * * 1'
  workflow_dispatch:
    inputs:
      source_date:
        description: '원본 데이터 기준일(선택, 예: 2026-07-01)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: static-data-manifest-writer
  cancel-in-progress: false

jobs:
  update-restrooms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync restroom data
        run: node scripts/sync-restrooms.js
        env:
          RESTROOM_SOURCE_DATE: ${{ inputs.source_date }}

      - name: Verify generated restroom data
        run: |
          node --test scripts/restroom-address-points.test.mjs scripts/restroom-host-address-points.test.mjs scripts/restroom-regional-overlays.test.mjs
          node scripts/audit-administrative-regions.js

      - name: Check changes
        id: check
        run: |
          git diff --name-only public/data/restrooms/ public/data/restroom-address-points/ public/data/restroom-v1-coordinates.json public/data/restroom-official-regional-coordinates.json public/data/restroom-official-address-points.json public/data/restroom-official-host-address-points.json public/data/manifest.json | head -20
          echo "changed=$(git diff --quiet public/data/restrooms/ public/data/restroom-address-points/ public/data/restroom-v1-coordinates.json public/data/restroom-official-regional-coordinates.json public/data/restroom-official-address-points.json public/data/restroom-official-host-address-points.json public/data/manifest.json && echo 'false' || echo 'true')" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/restrooms/ public/data/restroom-address-points/ public/data/restroom-v1-coordinates.json public/data/restroom-official-regional-coordinates.json public/data/restroom-official-address-points.json public/data/restroom-official-host-address-points.json public/data/manifest.json
          git commit -m "chore: 공중화장실 데이터 업데이트 ($(date +%Y-%m-%d))"
          git push
