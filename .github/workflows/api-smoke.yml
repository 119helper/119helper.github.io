name: Production API Smoke Test

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Run production API smoke tests
        run: node scripts/smoke-production-api.mjs
        env:
          VITE_API_BASE: https://119-helper-api.teemozipsa.workers.dev
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          SMOKE_MODE: scheduled

      - name: Install data audit dependencies
        run: npm ci --ignore-scripts

      - name: Detect newly published official datasets
        run: npm run audit:data-freshness
