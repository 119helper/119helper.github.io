version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: '04:10'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /worker
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
